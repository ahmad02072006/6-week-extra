<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 5 - Pokemon Finder</title>
<style>
  body { font-family: system-ui, sans-serif; background:#fef9c3; margin:0; padding:40px 16px; display:flex; justify-content:center; }
  .card { background:#fff; max-width:420px; width:100%; padding:26px; border-radius:16px; box-shadow:0 4px 18px rgba(0,0,0,.1); text-align:center; height:fit-content; }
  input { padding:9px 12px; border:1px solid #ccc; border-radius:8px; width:55%; }
  button { background:#dc2626; color:#fff; border:0; padding:10px 18px; border-radius:8px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; }
  img { width:160px; height:160px; image-rendering:pixelated; }
  .type { display:inline-block; background:#e2e8f0; padding:3px 10px; border-radius:999px; margin:2px; text-transform:capitalize; }
  .stats { text-align:left; margin-top:12px; }
  .bar { background:#e2e8f0; border-radius:6px; height:10px; margin-bottom:6px; }
  .bar span { display:block; height:100%; background:#16a34a; border-radius:6px; }
  #error { color:#dc2626; }
</style>
</head>
<body>
<div class="card">
  <h1>Pokemon Finder</h1>
  <input id="name" value="pikachu" placeholder="e.g. charizard">
  <button id="loadBtn">Search</button>
  <p id="status"></p>
  <p id="error"></p>
  <div id="result"></div>
</div>

<script>
async function loadPokemon() {
  const btn = document.getElementById('loadBtn');
  const name = document.getElementById('name').value.trim().toLowerCase();
  if (!name) return;
  btn.disabled = true;
  document.getElementById('status').textContent = 'Loading...';
  document.getElementById('error').textContent = '';
  document.getElementById('result').innerHTML = '';
  try {
    const res = await fetch('https://pokeapi.co/api/v2/pokemon/' + encodeURIComponent(name));
    // A 404 does NOT throw by itself, so check res.ok
    if (!res.ok) throw new Error(res.status === 404 ? 'Pokemon not found' : 'HTTP error: ' + res.status);
    const p = await res.json();
    const types = p.types.map(t => `<span class="type">${t.type.name}</span>`).join('');
    const stats = p.stats.map(s => `
      <div>${s.stat.name}: ${s.base_stat}</div>
      <div class="bar"><span style="width:${Math.min(s.base_stat / 2, 100)}%"></span></div>`).join('');
    document.getElementById('result').innerHTML = `
      <img src="${p.sprites.front_default}" alt="${p.name}">
      <h2 style="text-transform:capitalize">#${p.id} ${p.name}</h2>
      <div>${types}</div>
      <p>Height: ${p.height / 10} m &nbsp;|&nbsp; Weight: ${p.weight / 10} kg</p>
      <div class="stats">${stats}</div>`;
  } catch (err) {
    document.getElementById('error').textContent = err.message;
  } finally {
    document.getElementById('status').textContent = '';
    btn.disabled = false;
  }
}
document.getElementById('loadBtn').addEventListener('click', loadPokemon);
document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') loadPokemon(); });
</script>
</body>
</html>
