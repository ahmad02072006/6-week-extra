<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 1 - Random Joke Fetcher</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f4f6fb; display:flex; justify-content:center; padding:40px 16px; }
  .card { background:#fff; max-width:480px; width:100%; padding:28px; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.08); text-align:center; }
  button { background:#4f46e5; color:#fff; border:0; padding:10px 20px; border-radius:8px; font-size:1rem; cursor:pointer; margin:4px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #fav { background:#f59e0b; }
  #setup { font-weight:700; margin-top:20px; min-height:1.4em; }
  #punchline { margin-top:10px; color:#4f46e5; min-height:1.4em; }
  #error { color:#dc2626; margin-top:12px; }
  .spinner { width:28px; height:28px; border:4px solid #ddd; border-top-color:#4f46e5; border-radius:50%; animation:spin .8s linear infinite; margin:16px auto 0; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #favList { text-align:left; margin-top:20px; font-size:.9rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Random Joke Fetcher</h1>
  <button id="loadBtn">Load a Joke</button>
  <button id="fav">Save Favourite</button>
  <div class="spinner" id="spinner"></div>
  <p id="status"></p>
  <p id="setup"></p>
  <p id="punchline"></p>
  <p id="error"></p>
  <div id="favList"></div>
</div>

<script>
const API = 'https://official-joke-api.appspot.com/random_joke';
const loadBtn = document.getElementById('loadBtn');
const favBtn = document.getElementById('fav');
const spinner = document.getElementById('spinner');
let currentJoke = null;

async function loadJoke() {
  loadBtn.disabled = true;
  spinner.style.display = 'block';
  document.getElementById('status').textContent = 'Loading...';
  document.getElementById('error').textContent = '';
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('HTTP error: ' + res.status);
    const data = await res.json();
    currentJoke = data;
    document.getElementById('setup').textContent = data.setup;
    document.getElementById('punchline').textContent = data.punchline;
  } catch (err) {
    document.getElementById('error').textContent = 'Sorry, could not load a joke. (' + err.message + ')';
  } finally {
    document.getElementById('status').textContent = '';
    spinner.style.display = 'none';
    loadBtn.disabled = false;
  }
}

function getFavs() {
  try { return JSON.parse(localStorage.getItem('favJokes')) || []; }
  catch { return []; }
}
function renderFavs() {
  const favs = getFavs();
  document.getElementById('favList').innerHTML =
    favs.length ? '<h3>Favourites</h3>' + favs.map(j => `<p><b>${j.setup}</b><br>${j.punchline}</p>`).join('') : '';
}
favBtn.addEventListener('click', () => {
  if (!currentJoke) return;
  const favs = getFavs();
  if (!favs.some(j => j.id === currentJoke.id)) {
    favs.push({ id: currentJoke.id, setup: currentJoke.setup, punchline: currentJoke.punchline });
    localStorage.setItem('favJokes', JSON.stringify(favs));
  }
  renderFavs();
});

loadBtn.addEventListener('click', loadJoke);
renderFavs();
</script>
</body>
</html>
